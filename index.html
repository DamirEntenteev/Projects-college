<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Адаптивная галерея из трёх изображений на Flexbox и медиазапросах">
  <title>галерея</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1>Галерея изображений</h1>
    </header>

    <section class="gallery" aria-label="Галерея изображений">
      <figure class="gallery-card">
        <img src="images/LuLu.jpg" alt="Горные вершины, солнце и озеро">
        <figcaption><h2>Lost her eyes</h2><p>Silly Girl</p></figcaption>
      </figure>
      <figure class="gallery-card">
        <img src="images/Slender.webp" alt="Городской пейзаж на закате">
        <figcaption><h2>The tall man</h2><p>Kidnapping kids and eat them</p></figcaption>
      </figure>
      <figure class="gallery-card">
        <img src="images/Jane.webp" alt="Зелёный лес и солнечный свет">
        <figcaption><h2>Pretty Girl</h2><p>Hates Jeff</p></figcaption>
      </figure>
    </section>
  </main>
</body>
</html>
